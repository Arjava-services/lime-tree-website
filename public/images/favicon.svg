<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="favLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d5a27" />
      <stop offset="50%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#14532d" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="24" fill="#faf8f2" />
  
  <g filter="url(#favGlow)" transform="translate(10, 8)">
    <!-- Elegant 'L' letter -->
    <text x="14" y="66" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Baskerville', 'Georgia', serif" 
          font-size="64" 
          font-weight="700" 
          fill="#2d5a27">L</text>
    
    <!-- Sprouting Botanical Leaves -->
    <path d="M 28 26 C 24 16, 26 8, 38 6 C 42 16, 36 24, 28 26 Z" fill="url(#favLeafGrad)" />
    <path d="M 34 22 C 40 14, 50 10, 54 20 C 48 26, 40 26, 34 22 Z" fill="#84cc16" />
    
    <!-- Flourish undercurve -->
    <path d="M 12 72 Q 40 82 72 70" fill="none" stroke="#2d5a27" stroke-width="3" stroke-linecap="round" />
    <circle cx="70" cy="70" r="3" fill="#84cc16" />
  </g>
</svg>
