<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" width="100%" height="100%">
  <defs>
    <!-- Botanical Leaf Gradient -->
    <linearGradient id="leafGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d5a27" />
      <stop offset="50%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <!-- Lime Leaf Gradient Light -->
    <linearGradient id="leafGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4d7c0f" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <filter id="botanicalShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1e3a17" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Botanical Limetree Logo matching Main Page Artwork -->
  <g id="limetreeLogoGroup" filter="url(#botanicalShadow)">
    
    <!-- Top Left Leaves sprouting from 'L' -->
    <g transform="translate(18, 12)">
      <!-- Left Leaf -->
      <path d="M 12 18 C 6 12, 4 4, 16 2 C 18 10, 16 16, 12 18 Z" fill="url(#leafGradLight)" />
      <!-- Top Center Leaf -->
      <path d="M 16 14 C 18 6, 26 2, 30 10 C 26 16, 20 16, 16 14 Z" fill="url(#leafGradDark)" />
      <circle cx="15" cy="15" r="1.5" fill="#4d7c0f" />
    </g>

    <!-- Leaves Sprouting above the letter 'i' -->
    <g transform="translate(108, 4)">
      <!-- Left sprout leaf -->
      <path d="M 12 24 C 6 18, 4 8, 16 4 C 20 12, 17 20, 12 24 Z" fill="url(#leafGradLight)" />
      <!-- Right sprout leaf -->
      <path d="M 16 20 C 20 12, 28 6, 32 14 C 28 22, 21 22, 16 20 Z" fill="url(#leafGradDark)" />
      <!-- Center Stem -->
      <path d="M 13 25 Q 15 18 18 12" fill="none" stroke="#2d5a27" stroke-width="1.8" stroke-linecap="round" />
    </g>

    <!-- Main Typography: Limetree in Classic High-End Botanical Serif -->
    <text x="24" y="66" 
          font-family="'Playfair Display', 'Cormorant Garamond', 'Baskerville', 'Georgia', serif" 
          font-size="62" 
          font-weight="700" 
          letter-spacing="-0.01em" 
          fill="#2d5a27">
      L<tspan font-size="54" dx="-2">ime</tspan><tspan font-size="54">tree</tspan>
    </text>

    <!-- Decorative Underline Swoosh with Botanical Flourish -->
    <!-- Curved flourish swoosh running gracefully from under 'L' to past 'e' -->
    <path d="M 28 72 C 70 70, 100 86, 170 86 C 240 86, 280 72, 335 70" 
          fill="none" 
          stroke="#2d5a27" 
          stroke-width="2.6" 
          stroke-linecap="round" />

    <!-- Leaf accent at the end of the underline swoosh -->
    <g transform="translate(326, 56)">
      <!-- Leaf 1 -->
      <path d="M 6 15 C 14 12, 24 16, 22 24 C 14 26, 8 20, 6 15 Z" fill="url(#leafGradLight)" />
      <!-- Leaf 2 -->
      <path d="M 8 13 C 14 6, 22 4, 25 10 C 22 16, 15 16, 8 13 Z" fill="url(#leafGradDark)" />
      <path d="M 6 15 Q 12 14 18 15" fill="none" stroke="#2d5a27" stroke-width="1.2" stroke-linecap="round" />
    </g>
  </g>
</svg>
