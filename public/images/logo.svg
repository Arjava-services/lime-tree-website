<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%">
  <defs>
    <!-- Premium Fresh Lime Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="45%" stop-color="#65a30d" />
      <stop offset="100%" stop-color="#3f6212" />
    </linearGradient>

    <!-- Leaf Accent Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#bef264" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#365314" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Modern LimeTree Icon -->
  <g transform="translate(6, 9)" filter="url(#iconGlow)">
    <!-- Rounded Pebble Background -->
    <rect x="0" y="0" width="72" height="72" rx="20" fill="url(#limeGrad)" />
    
    <!-- Crisp Inner Highlight Border -->
    <rect x="1.5" y="1.5" width="69" height="69" rx="18.5" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Organic Tree Trunk & Branches -->
    <path d="M36 58 V28" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <path d="M36 44 Q25 38 21 30" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <path d="M36 38 Q47 32 51 25" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" />

    <!-- Lush Lime Leaves -->
    <!-- Center Top Leaf -->
    <path d="M36 15 C29 20 30 28 36 28 C42 28 43 20 36 15 Z" fill="url(#leafGrad)" />
    <!-- Left Leaf -->
    <path d="M21 30 C14 32 16 41 23 39 C26 37 26 32 21 30 Z" fill="url(#leafGrad)" />
    <!-- Right Leaf -->
    <path d="M51 25 C58 27 56 36 49 34 C46 32 46 27 51 25 Z" fill="url(#leafGrad)" />

    <!-- Delicate Sparkle Nodes -->
    <circle cx="36" cy="28" r="3" fill="#ffffff" />
    <circle cx="53" cy="46" r="2.5" fill="#fef08a" />
    <circle cx="19" cy="48" r="2.5" fill="#fef08a" />
  </g>

  <!-- Clean, Bold Typography: LimeTree ONLY (No tiny subtext) -->
  <g transform="translate(94, 10)">
    <text x="0" y="50" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em" fill="#0f172a">
      Lime<tspan fill="#65a30d">Tree</tspan>
    </text>
  </g>
</svg>
